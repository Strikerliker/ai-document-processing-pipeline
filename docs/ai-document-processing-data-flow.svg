<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">AI Document Processing Pipeline – Data Flow Diagram</title>
<desc id="desc">Event-driven serverless document data flow from S3 input through EventBridge, Step Functions, Textract, Lambda and Amazon Bedrock to normalized JSON output in S3, with supporting CloudWatch, IAM, Terraform, and GitHub Actions controls.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061a30"/><stop offset="1" stop-color="#03111f"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c2945"/><stop offset="1" stop-color="#071b30"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity=".28"/></filter>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#66c3ff"/></marker>
  <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9f7bff"/></marker>
  <style>
    .t{font-family:Arial,Helvetica,sans-serif;fill:#f7fbff}.m{font-family:Arial,Helvetica,sans-serif;fill:#abc7dc}.h{font-weight:700}
    .panel{fill:url(#card);stroke:#2c79aa;stroke-width:1.5}.support{fill:#0a2239;stroke:#2c79aa;stroke-width:1.5}
    .line{stroke:#66c3ff;stroke-width:3.2;fill:none;marker-end:url(#arr)}.dash{stroke:#9f7bff;stroke-width:2.3;fill:none;stroke-dasharray:7 6;marker-end:url(#arr2)}
    .small{font-size:13px}.tiny{font-size:11px}.cap{font-size:13px;letter-spacing:2px;fill:#6ec1ff}
  </style>
</defs>

<rect width="1600" height="900" rx="22" fill="url(#bg)"/>
<text x="800" y="52" text-anchor="middle" class="t h" font-size="40">AI Document Processing Pipeline – Data Flow Diagram</text>
<text x="800" y="86" text-anchor="middle" class="m" font-size="18">Event-driven serverless flow for OCR, AI enrichment, and structured output</text>

<!-- Main flow -->
<g transform="translate(30 155)">
  <rect width="1540" height="465" rx="18" fill="#08223b" stroke="#1f91d0" stroke-width="2"/>
  <text x="25" y="34" class="cap">DOCUMENT DATA FLOW</text>

  <!-- 1 S3 -->
  <g transform="translate(20 60)">
    <rect width="165" height="320" rx="14" class="panel" filter="url(#sh)" style="stroke:#2ed08a"/>
    <circle cx="82" cy="-2" r="20" fill="#062039" stroke="#2ed08a" stroke-width="3"/><text x="82" y="5" text-anchor="middle" class="t h" font-size="18">1</text>
    <rect x="50" y="32" width="64" height="64" rx="10" fill="#7AA116"/>
    <ellipse cx="82" cy="51" rx="19" ry="7" fill="none" stroke="#fff" stroke-width="3"/><path d="M63 51v32c0 9 38 9 38 0V51" fill="none" stroke="#fff" stroke-width="3"/>
    <text x="82" y="130" text-anchor="middle" class="t h" font-size="19">Amazon S3</text><text x="82" y="153" text-anchor="middle" class="t h" font-size="19">Input</text>
    <text x="82" y="190" text-anchor="middle" class="m small">Uploaded PDFs</text><text x="82" y="210" text-anchor="middle" class="m small">and images</text><text x="82" y="230" text-anchor="middle" class="m small">encrypted + versioned</text>
  </g>

  <!-- 2 EventBridge -->
  <g transform="translate(245 60)">
    <rect width="165" height="320" rx="14" class="panel" filter="url(#sh)" style="stroke:#bb63d8"/>
    <circle cx="82" cy="-2" r="20" fill="#23163f" stroke="#d267f2" stroke-width="3"/><text x="82" y="5" text-anchor="middle" class="t h" font-size="18">2</text>
    <rect x="50" y="32" width="64" height="64" rx="10" fill="#D82B78"/>
    <circle cx="82" cy="64" r="8" fill="none" stroke="#fff" stroke-width="2.5"/><circle cx="62" cy="47" r="5" fill="none" stroke="#fff" stroke-width="2.5"/><circle cx="102" cy="47" r="5" fill="none" stroke="#fff" stroke-width="2.5"/><circle cx="62" cy="81" r="5" fill="none" stroke="#fff" stroke-width="2.5"/><circle cx="102" cy="81" r="5" fill="none" stroke="#fff" stroke-width="2.5"/><path d="M68 51l9 8M96 51l-9 8M68 77l9-8M96 77l-9-8" stroke="#fff" stroke-width="2"/>
    <text x="82" y="130" text-anchor="middle" class="t h" font-size="18">Amazon</text><text x="82" y="153" text-anchor="middle" class="t h" font-size="18">EventBridge</text>
    <text x="82" y="190" text-anchor="middle" class="m small">Object-created event</text><text x="82" y="210" text-anchor="middle" class="m small">triggers processing</text>
  </g>

  <!-- 3 SFN -->
  <g transform="translate(470 60)">
    <rect width="175" height="320" rx="14" class="panel" filter="url(#sh)" style="stroke:#bb63d8"/>
    <circle cx="87" cy="-2" r="20" fill="#23163f" stroke="#d267f2" stroke-width="3"/><text x="87" y="5" text-anchor="middle" class="t h" font-size="18">3</text>
    <rect x="55" y="32" width="64" height="64" rx="10" fill="#D82B78"/>
    <rect x="67" y="45" width="17" height="12" rx="2" fill="none" stroke="#fff" stroke-width="2.4"/><rect x="91" y="45" width="17" height="12" rx="2" fill="none" stroke="#fff" stroke-width="2.4"/><rect x="79" y="69" width="18" height="12" rx="2" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M75 57v7h13M100 57v7H88" stroke="#fff" stroke-width="2"/>
    <text x="87" y="130" text-anchor="middle" class="t h" font-size="18">AWS Step</text><text x="87" y="153" text-anchor="middle" class="t h" font-size="18">Functions</text>
    <text x="87" y="190" text-anchor="middle" class="m small">Starts workflow</text><text x="87" y="210" text-anchor="middle" class="m small">waits + polls</text><text x="87" y="230" text-anchor="middle" class="m small">handles failure states</text>
  </g>

  <!-- 4 Textract -->
  <g transform="translate(705 60)">
    <rect width="165" height="320" rx="14" class="panel" filter="url(#sh)" style="stroke:#29d4db"/>
    <circle cx="82" cy="-2" r="20" fill="#08343e" stroke="#32dce5" stroke-width="3"/><text x="82" y="5" text-anchor="middle" class="t h" font-size="18">4</text>
    <rect x="50" y="32" width="64" height="64" rx="10" fill="#00A9A5"/>
    <path d="M66 45h24l10 10v27H66zM90 45v10h10M72 65h20M72 72h20" fill="none" stroke="#fff" stroke-width="2.3"/><circle cx="80" cy="65" r="14" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="82" y="130" text-anchor="middle" class="t h" font-size="18">Amazon</text><text x="82" y="153" text-anchor="middle" class="t h" font-size="18">Textract</text>
    <text x="82" y="190" text-anchor="middle" class="m small">Asynchronous OCR</text><text x="82" y="210" text-anchor="middle" class="m small">text extraction</text>
  </g>

  <!-- 5 Lambda -->
  <g transform="translate(930 60)">
    <rect width="165" height="320" rx="14" class="panel" filter="url(#sh)" style="stroke:#ff9a2e"/>
    <circle cx="82" cy="-2" r="20" fill="#3a250a" stroke="#ff9a2e" stroke-width="3"/><text x="82" y="5" text-anchor="middle" class="t h" font-size="18">5</text>
    <rect x="50" y="32" width="64" height="64" rx="10" fill="#FF9900"/>
    <path d="M66 45h14l11 37H80l-6-18-7 18H56l13-28z" fill="none" stroke="#fff" stroke-width="3"/>
    <text x="82" y="130" text-anchor="middle" class="t h" font-size="18">AWS Lambda</text>
    <text x="82" y="178" text-anchor="middle" class="m small">Combines extracted text</text><text x="82" y="198" text-anchor="middle" class="m small">builds grounded prompt</text><text x="82" y="218" text-anchor="middle" class="m small">normalizes output</text>
  </g>

  <!-- 6 Bedrock -->
  <g transform="translate(1155 60)">
    <rect width="165" height="320" rx="14" class="panel" filter="url(#sh)" style="stroke:#3bb5ff"/>
    <circle cx="82" cy="-2" r="20" fill="#062039" stroke="#3bb5ff" stroke-width="3"/><text x="82" y="5" text-anchor="middle" class="t h" font-size="18">6</text>
    <rect x="50" y="32" width="64" height="64" rx="10" fill="#00A9A5"/>
    <path d="M82 44c-9 0-15 7-15 16 0 5 3 10 7 13v10M82 44c9 0 15 7 15 16 0 5-3 10-7 13v10M74 58h16M74 66h16M82 44v39" fill="none" stroke="#fff" stroke-width="2.3"/>
    <text x="82" y="130" text-anchor="middle" class="t h" font-size="18">Amazon</text><text x="82" y="153" text-anchor="middle" class="t h" font-size="18">Bedrock</text>
    <text x="82" y="190" text-anchor="middle" class="m small">Classify document</text><text x="82" y="210" text-anchor="middle" class="m small">summarize + actions</text><text x="82" y="230" text-anchor="middle" class="m small">confidence score</text>
  </g>

  <!-- 7 S3 output -->
  <g transform="translate(1380 60)">
    <rect width="140" height="320" rx="14" class="panel" filter="url(#sh)" style="stroke:#2ed08a"/>
    <circle cx="70" cy="-2" r="20" fill="#062039" stroke="#2ed08a" stroke-width="3"/><text x="70" y="5" text-anchor="middle" class="t h" font-size="18">7</text>
    <rect x="38" y="32" width="64" height="64" rx="10" fill="#7AA116"/>
    <ellipse cx="70" cy="51" rx="19" ry="7" fill="none" stroke="#fff" stroke-width="3"/><path d="M51 51v32c0 9 38 9 38 0V51" fill="none" stroke="#fff" stroke-width="3"/>
    <text x="70" y="130" text-anchor="middle" class="t h" font-size="18">Amazon S3</text><text x="70" y="153" text-anchor="middle" class="t h" font-size="18">Output</text>
    <text x="70" y="190" text-anchor="middle" class="m small">Normalized JSON</text><text x="70" y="210" text-anchor="middle" class="m small">processed/</text>
  </g>

  <!-- arrows -->
  <path d="M185 220H245" class="line"/><text x="215" y="200" text-anchor="middle" class="m tiny">upload</text>
  <path d="M410 220H470" class="line"/><text x="440" y="200" text-anchor="middle" class="m tiny">object event</text>
  <path d="M645 220H705" class="line"/><text x="675" y="200" text-anchor="middle" class="m tiny">start</text>
  <path d="M870 220H930" class="line"/><text x="900" y="200" text-anchor="middle" class="m tiny">text</text>
  <path d="M1095 220H1155" class="line"/><text x="1125" y="200" text-anchor="middle" class="m tiny">validated prompt</text>
  <path d="M1320 220H1380" class="line"/><text x="1350" y="200" text-anchor="middle" class="m tiny">JSON</text>

  <!-- feedback loop -->
  <path d="M1012 380V420H557V380" class="dash"/>
  <text x="785" y="442" text-anchor="middle" class="m small">Textract job complete → return extracted text for processing</text>
</g>

<!-- supporting controls -->
<rect x="30" y="645" width="1540" height="185" rx="18" fill="#08223b" stroke="#1f91d0" stroke-width="2"/>
<text x="55" y="677" class="cap">SUPPORTING CONTROLS</text>

<g transform="translate(55 705)">
  <rect width="330" height="95" rx="12" class="support"/>
  <rect x="20" y="17" width="60" height="60" rx="9" fill="#D82B78"/>
  <path d="M32 56c0-11 14-16 22-8 5-12 22-6 23 6 8 2 8 17-2 17H39c-8 0-11-10-7-15z" fill="none" stroke="#fff" stroke-width="2.3"/><circle cx="68" cy="65" r="8" fill="none" stroke="#fff" stroke-width="2.2"/><path d="M74 71l7 7" stroke="#fff" stroke-width="2.2"/>
  <text x="100" y="42" class="t h" font-size="15">Amazon CloudWatch</text><text x="100" y="64" class="m small">Logs, metrics, alarms</text>
</g>

<g transform="translate(410 705)">
  <rect width="330" height="95" rx="12" class="support"/>
  <rect x="20" y="17" width="60" height="60" rx="9" fill="#DD344C"/>
  <path d="M35 50h24v20H35zM39 50V40c0-10 16-10 16 0v10" fill="none" stroke="#fff" stroke-width="2.5"/><path d="M63 42h10M63 50h10M63 58h10" stroke="#fff" stroke-width="2"/>
  <text x="100" y="42" class="t h" font-size="15">AWS IAM</text><text x="100" y="64" class="m small">Least-privilege service roles</text>
</g>

<g transform="translate(765 705)">
  <rect width="330" height="95" rx="12" class="support"/>
  <rect x="20" y="17" width="60" height="60" rx="9" fill="#6544C6"/>
  <path d="M35 32l15 7v17l-15-7zm17 8l15 7v17l-15-7zm0-16l15 7v15l-15-7z" fill="none" stroke="#fff" stroke-width="2.2"/>
  <text x="100" y="42" class="t h" font-size="15">Terraform</text><text x="100" y="64" class="m small">Infrastructure as Code</text>
</g>

<g transform="translate(1120 705)">
  <rect width="425" height="95" rx="12" class="support"/>
  <circle cx="55" cy="47" r="28" fill="#151515"/><path d="M42 53c-4-13 4-22 13-22 11 0 18 9 15 22-3 9-8 13-15 13-6 0-11-4-13-13z" fill="#fff"/>
  <text x="100" y="42" class="t h" font-size="15">GitHub Actions</text><text x="100" y="64" class="m small">Tests, linting, Terraform validation</text>
</g>

<text x="1570" y="875" text-anchor="end" class="cap">BUILD • PROCESS • UNDERSTAND • WITH AWS</text>
</svg>